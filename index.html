<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog Preview Card</title>
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <main class="card">
      <img
        src="assets/images/illustration-article.svg"
        alt="Ilustración del artículo"
        class="card-image"
      />

      <div class="card-content">
        <span class="tag">Aprendizaje</span>
        <h1 class="title">HTML & CSS foundations</h1>
        <p class="description">
          Estos lenguajes son la base de todo desarrollo web. Domínalos y podrás
          construir interfaces sólidas y escalables.
        </p>

        <div class="author">
          <img
            src="assets/images/image-avatar.webp"
            alt="Avatar del autor"
            class="avatar"
          />
          <p class="author-name">Greg Hooper</p>
        </div>
      </div>
    </main>
  </body>
</html>
